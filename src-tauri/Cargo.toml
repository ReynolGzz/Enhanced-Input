[package]
name = "enhanced-input"
version = "0.1.0"
description = "Enhanced Input - controller remapper for Windows"
authors = ["ReynolGzz"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri builds against; main.rs is a thin launcher.
[lib]
name = "enhanced_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
dirs = "5"
log = "0.4"
# Deterministic, shareable profile codes (deflate + base58).
flate2 = "1"
bs58 = "0.5"
# In-app auto-update (checks signed GitHub releases) + relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Windows-only: physical controller (HID), virtual pad (ViGEm), key injection.
[target.'cfg(windows)'.dependencies]
hidapi = "2"
vigem-client = "0.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
